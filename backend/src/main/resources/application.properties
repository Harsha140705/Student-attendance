spring.application.name=student-attendance-system
server.port=${SERVER_PORT:8000}

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/attendance_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# SQL Script Initialization (schema.sql & data.sql)
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
spring.sql.init.continue-on-error=true

# Logging Configuration
logging.level.com.attendance=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
